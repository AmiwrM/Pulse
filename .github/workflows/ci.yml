name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Installer shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x -S warning install.sh deploy/install-agent.sh
          bash -n install.sh
          bash -n deploy/install-agent.sh
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/pulse ./cmd/pulse
